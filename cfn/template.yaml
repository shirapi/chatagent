AWSTemplateFormatVersion: "2010-09-09"

Description:
  CodePipeline Create

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "CodePipeline Configuration"
        Parameters:
          - ConnectionArn
          - ChatBotArn
          - RequireApprovalAction
          - BranchName

Parameters:
  ConnectionArn:
    Type: String

  ChatBotArn:
    Type: String
  
  RequireApprovalAction:
    Type: String
    AllowedValues:
      - true
      - false

  BranchName:
    Type: String
    Default: main

  Env:
    Type: String
    AllowedValues:
      - local
      - prod

Conditions:
  HasApprovalAction:
    !Equals
      - !Ref RequireApprovalAction
      - true

Resources:
  ChatAgentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: 'S3'
        Location: !Ref S3BucketArticactStore
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName
      Stages:
        - Name: Source
          Actions:
            - Name : Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeStarSourceConnection
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: shirapi/chatagent
                BranchName: !Ref BranchName
                OutputArtifactFormat: 'CODE_ZIP'
              RunOrder: 1
              OutputArtifacts:
                - Name: 'Source'
        - !If
          - HasApprovalAction
          - Name: ReleaseApproval
            Actions:
              - Name: ApprovalAction
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Version: 1
                  Provider: Manual
                RunOrder: 1
          - !Ref AWS::NoValue
        - Name: Build
          Actions:
            - Name: BuildChatAgent
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: ChatAgent-CodeBuild
              RunOrder: 1
              InputArtifacts:
                - Name: Source
              OutputArtifacts:
                - Name: BuildChatAgent

  CodeBuildChatAgentProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ChatAgent-CodeBuild
      ServiceRole: !Ref CodeBuildServiceRole
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ./buildspec.yaml
      Environment:
        PrivilegedMode: true
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: Env
            Value: !Ref Env

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGet*
                  - codebuild:Get*
                  - codebuild:List*
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                  - iam:PassRole
              - Resource: "arn:aws:ssm:*:*:parameter/CodeBuild/*"
                Effect: Allow
                Action:
                  - ssm:PutParameter
              - Resource: "*"
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # CodeBuild自身のビルドログ出力先
              - Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/ChatAgent-CodeBuild"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/ChatAgent-CodeBuild:*"
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
              # sam deployが操作するCloudFormationスタック（stack_name: chatagent）
              - Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/chatagent/*"
                Effect: Allow
                Action:
                  - cloudformation:*
              # template.yamlが定義するLambda関数（chatagent-ReceiverFunction / chatagent-WorkerFunction）
              - Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chatagent-*"
                Effect: Allow
                Action:
                  - lambda:*
              # CloudFormationが作成するLambda実行ロール等（スタック名に基づき chatagent- で始まる）
              - Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/chatagent-*"
                Effect: Allow
                Action:
                  - iam:*
              # template.yamlが定義するロググループ
              - Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/chatagent-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/chatagent*"
                Effect: Allow
                Action:
                  - logs:*
              # SAMのデプロイ用管理バケットと、このパイプラインのアーティファクト用バケット
              - Resource:
                  - !Sub "arn:aws:s3:::aws-sam-cli-managed-default*"
                  - !Sub "arn:aws:s3:::aws-sam-cli-managed-default*/*"
                  - !GetAtt S3BucketArticactStore.Arn
                  - !Sub "${S3BucketArticactStore.Arn}/*"
                Effect: Allow
                Action:
                  - s3:*
              # template.yamlが定義するAPI Gateway（ChatAgentApi）
              - Resource: "*"
                Effect: Allow
                Action:
                  - apigateway:*
              - Resource: "*"
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
              - Resource: "*"
                Effect: Allow
                Action:
                  - scheduler:GetSchedule
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:ListSchedules

  S3BucketArticactStore:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub Chatagent-codepipeline-${AWS::AccountId}

