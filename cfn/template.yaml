AWSTemplateFormatVersion: "2010-09-09"

Description:
  CodePipeline Create

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "CodePipeline Configuration"
        Parameters:
          - ConnectionArn
          - ChatBotArn
          - RequireApprovalAction
          - BranchName

Parameters:
  ConnectionArn:
    Type: String

  ChatBotArn:
    Type: String
  
  RequireApprovalAction:
    Type: String
    AllowedValues:
      - true
      - false

  BranchName:
    Type: String
    Default: main

  Env:
    Type: String
    AllowedValues:
      - local
      - prod

Conditions:
  HasApprovalAction:
    !Equals
      - !Ref RequireApprovalAction
      - true

Resources:
  ChatAgentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: 'S3'
        Location: !Ref S3BucketArticactStore
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName
      Stages:
        - Name: Source
          Actions:
            - Name : Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeStarSourceConnection
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: shirapi/Chatagent
                BranchName: !Ref BranchName
                OutputArtifactFormat: 'CODE_ZIP'
              RunOrder: 1
              OutputArtifacts:
                - Name: 'Source'
        - !If
          - HasApprovalAction
          - Name: ReleaseApproval
            Actions:
              - Name: ApprovalAction
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Version: 1
                  Provider: Manual
                RunOrder: 1
          - !Ref AWS::NoValue
        - Name: Build
          Actions:
            - Name: BuildChatAgent
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: ChatAgent-CodeBuild
              RunOrder: 1
              InputArtifacts:
                - Name: Source
              OutputArtifacts:
                - Name: BuildChatAgent

  CodeBuildChatAgentProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ChatAgent-CodeBuild
      ServiceRole: !Ref CodeBuildServiceRole
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ./buildspec.yaml
      Environment:
        PrivilegedMode: true
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: Env
            Value: !Ref Env

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGet*
                  - codebuild:Get*
                  - codebuild:List*
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                  - iam:PassRole
              - Resource: "arn:aws:ssm:*:*:parameter/CodeBuild/*"
                Effect: Allow
                Action:
                  - ssm:PutParameter
              - Resource: "*"
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
              - Resource: "*"
                Effect: Allow
                Action:
                  - scheduler:GetSchedule
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:ListSchedules

  S3BucketArticactStore:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub Chatagent-codepipeline-${AWS::AccountId}

  ChatAgentNotificationRule:
    Type: AWS::CodeStarNotifications::NotificationRule
    Properties:
      Name: Chatagent-codepipeline-notification-rule
      Resource: !Join [ '', [ 'arn:aws:codepipeline:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':', !Ref ChatAgentPipeline ] ]
      DetailType: FULL
      EventTypeIds:
        - codepipeline-pipeline-stage-execution-started
        - codepipeline-pipeline-stage-execution-succeeded
        - codepipeline-pipeline-stage-execution-resumed
        - codepipeline-pipeline-stage-execution-canceled
        - codepipeline-pipeline-stage-execution-failed
      Targets:
        - TargetType: AWSChatbotSlack
          TargetAddress: !Ref ChatBotArn
