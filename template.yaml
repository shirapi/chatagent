AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  chat agent

  SAM Template for chat agent

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 180
    MemorySize: 256

Parameters:
  Env:
    Type: String
    Default: local
    AllowedValues:
      - local
      - prod
  SlackOAuthToken:
    Type: String
    Description: Slack OAuth token
    Default: ""
    NoEcho: true
  SlackChannelID:
    Type: String
    Description: Slack channel ID
    Default: ""
    NoEcho: true
  SlackSigningSecret:
    Type: String
    Description: Slack signing secret
    Default: ""
    NoEcho: true
  SlackReactionName:
    Type: String
    Description: Reaction name to add while processing
    Default: "eyes"
  AgentCoreRuntimeArn:
    Type: String
    Description: Bedrock AgentCore Runtime ARN to invoke
    Default: ""

Resources:
  # API Gateway
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ChatAgentApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: Prod
      AccessLogSetting:
        DestinationArn: !GetAtt ChatAgentApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","integrationStatus":"$context.integrationStatus","integrationErrorMessage":"$context.integrationErrorMessage"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  ChatAgentApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/apigateway/chatagent
      RetentionInDays: 3

  # Lambda Function
  ChatAgentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: chatagent-ChatAgentFunction
      CodeUri: ./src/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
      - x86_64
      Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
        Variables:
         APP_ENV: !Ref Env
         SLACK_OAUTH_TOKEN: !Ref SlackOAuthToken
         SLACK_CHANNEL_ID: !Ref SlackChannelID
         SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
         SLACK_REACTION_NAME: !Ref SlackReactionName
         AGENTCORE_RUNTIME_ARN: !Ref AgentCoreRuntimeArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
                - bedrock-agentcore:InvokeAgentRuntimeForUser
                - bedrock-agentcore:GetAgentRuntime
              Resource:
                - !Ref AgentCoreRuntimeArn
                - !Sub "${AgentCoreRuntimeArn}/*"
      Events:
        SlackEvents:
          Type: Api
          Properties:
            RestApiId: !Ref ChatAgentApi
            Path: /slack/events
            Method: post

  ChatAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatAgentFunction}
      RetentionInDays: 3
