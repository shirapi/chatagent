name: test

on:
  pull_request:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: goimports
        run: |
          go run golang.org/x/tools/cmd/goimports@latest -l . | tee /tmp/goimports.out
          test ! -s /tmp/goimports.out

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/app/chatagent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: uv sync --all-groups

      - name: pytest
        run: uv run pytest
